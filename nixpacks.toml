# Coolify · Nixpacks (Node / pnpm)
# Prisma 7 + Node 22.11 de Nix: require(ESM) necesita NODE_OPTIONS.
[variables]
NODE_OPTIONS = "--experimental-require-module"
NIXPACKS_NODE_VERSION = "22"
# Solo para generate en build; Coolify inyecta DATABASE_URL real en runtime.
DATABASE_URL = "postgresql://prisma:prisma@127.0.0.1:5432/prisma?schema=public"

[phases.setup]
nixPkgs = ["nodejs_22", "pnpm-10_x", "openssl"]

[phases.install]
cmds = [
  "npm install -g corepack@0.24.1 && corepack enable",
  "pnpm i --frozen-lockfile",
]

[phases.build]
cmds = ["pnpm run build"]

[start]
cmd = "pnpm prisma migrate deploy && pnpm run start:prod"
