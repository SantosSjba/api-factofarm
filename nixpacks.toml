# Coolify · Nixpacks
# Prisma 7 exige Node 20.19+ / 22.12+ / 24+ (nodejs_22 de Nix = 22.11 → falla).
[variables]
NODE_OPTIONS = "--experimental-require-module"
NIXPACKS_NODE_VERSION = "24"
DATABASE_URL = "postgresql://prisma:prisma@127.0.0.1:5432/prisma?schema=public"
NPM_CONFIG_PRODUCTION = "false"

[phases.setup]
nixPkgs = ["nodejs_24", "pnpm-10_x", "openssl"]

[phases.install]
cmds = [
  "npm install -g corepack@0.24.1 && corepack enable",
  "pnpm i --frozen-lockfile",
]

[phases.build]
cmds = ["pnpm run build"]

[start]
cmd = "pnpm prisma migrate deploy && pnpm run start:prod"
