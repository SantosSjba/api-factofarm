name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: factofarm
          POSTGRES_PASSWORD: factofarm
          POSTGRES_DB: factofarm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://factofarm:factofarm@localhost:5432/factofarm
      JWT_SECRET: ci-test-jwt-secret-with-enough-length-32chars
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Migrate database
        run: pnpm prisma:deploy

      - name: Seed database
        run: pnpm db:seed

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test -- --passWithNoTests

      - name: E2E tests
        run: pnpm run test:e2e

      - name: Build
        run: pnpm run build
